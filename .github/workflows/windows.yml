name: Windows portable build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - run: python -m pip install -r requirements-build.txt
      - shell: pwsh
        run: ./build.ps1
      - shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'live-monitor-test.txt'
          $test = Start-Process -FilePath './dist/Live-Monitor/Live-Monitor.exe' -ArgumentList "--self-test `"$report`"" -Wait -PassThru -WindowStyle Hidden
          if ($test.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Self-test failed' }
          Get-Content $report
      - uses: actions/upload-artifact@v4
        with:
          name: Live-Monitor-Windows-x64
          path: dist/Live-Monitor-Windows-x64.zip
